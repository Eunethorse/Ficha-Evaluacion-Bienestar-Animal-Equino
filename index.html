<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ficha de Evaluación de Bienestar Animal Equino</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#2F4F3E;--ink-l:#E7F0EA;--white:#fff;--cream:#FBF1DE;
  --red:#C0392B;--red-l:#FFE4E4;--amber:#856A00;--amber-l:#FFFBEA;
  --orange:#E67E22;--orange-l:#FEF0E6;--blue:#1A5276;--blue-l:#EBF5FB;
  --green:#1A7F37;--green-l:#E6F9EE;--purple:#6C3483;--purple-l:#F5EEF8;
  --gray:#888;--bg:#FAFAFA;
  --s0c:#1A7F37;--s0b:#E6F9EE;--s1c:#856A00;--s1b:#FFFBEA;
  --s2c:#E67E22;--s2b:#FEF0E6;--s3c:#C0392B;--s3b:#FFE4E4;
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:#1a1a1a;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:inherit}
.app{max-width:600px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.header{background:var(--ink);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}
.header h1{font-size:14px;font-weight:700;margin:0}.header small{font-size:10px;opacity:.7;display:block}
.header .flex1{flex:1}
.btn-new{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer}
.tabs{display:flex;background:#fff;border-bottom:1px solid #eee;overflow-x:auto;flex-shrink:0;-webkit-overflow-scrolling:touch}
.tab-btn{flex:0 0 auto;padding:8px 12px;border:none;cursor:pointer;background:transparent;border-bottom:2px solid transparent;color:#888;font-size:11px;font-weight:400;white-space:nowrap}
.tab-btn.active{font-weight:700}
.content{flex:1;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch}
.section-hdr{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:6px;background:var(--ink-l);padding:4px 10px;border-radius:6px}
.field{margin-bottom:8px}
.field label{font-size:11px;color:#666;display:block;margin-bottom:2px}
.field input,.field select,.field textarea{width:100%;padding:8px;border-radius:6px;border:1px solid #ddd;font-size:13px}
.field textarea{resize:vertical;min-height:40px}
.area-banner{border-radius:10px;padding:12px 14px;margin-bottom:10px;color:#fff}
.area-banner h2{font-size:16px;font-weight:700;margin:0}.area-banner small{font-size:11px;opacity:.8}
.progress{display:flex;align-items:center;gap:6px;font-size:11px;margin-top:6px}
.progress-bar{flex:1;height:4px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;transition:width .3s}
.card{background:#fff;border-radius:10px;margin-bottom:10px;border:1px solid #e0e0e0;overflow:hidden}
.card.crit3{border:2px solid var(--red)}
.card-head{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;user-select:none}
.card-head .num{font-size:13px;font-weight:700;border-radius:6px;padding:2px 7px;min-width:28px;text-align:center}
.card-head .num.crit{background:var(--red-l);color:var(--red)}
.card-head .title{font-size:14px;font-weight:600;color:#1a1a1a;line-height:1.3}
.card-head .sub{font-size:11px;color:#888;margin-top:1px}
.card-head .badge{font-size:16px;font-weight:800;border-radius:8px;padding:3px 10px}
.card-head .arrow{font-size:11px;color:#aaa;transition:transform .2s}
.card-head .arrow.open{transform:rotate(180deg)}
.card-body{padding:0 12px 12px;border-top:1px solid #f0f0f0}
.mom-tags{display:flex;gap:3px;margin:10px 0 6px}
.mom-tag{font-size:10px;border-radius:4px;padding:2px 6px;font-weight:600}
.crit-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:8px 0}
.crit-cell{font-size:10px;line-height:1.35;padding:6px 8px;border-radius:6px}
.score-btns{display:flex;gap:4px;margin-top:8px}
.score-btn{flex:1;border:2px solid transparent;border-radius:8px;font-weight:700;font-size:15px;padding:8px 0;cursor:pointer;transition:all .15s;min-width:0}
.score-btn.sel{color:#fff!important}
.clear-btn{background:#f5f5f5;color:#999;border:none;border-radius:8px;font-size:11px;padding:6px 10px;cursor:pointer}
.obs-field{width:100%;margin-top:8px;padding:8px;border-radius:6px;font-size:12px;border:1px solid #ddd;resize:vertical;min-height:40px}
.legal-ref{font-size:9px;color:#bbb;margin-top:4px}
.area-result{border-radius:10px;padding:14px;margin-top:8px;color:#fff}
.area-result .media{font-size:28px;font-weight:800}
.area-result .nivel-badge{border-radius:8px;padding:4px 12px;font-size:13px;font-weight:700}
.area-result .act{font-size:10px;margin-top:4px;opacity:.8}
.area-result .crit-alert{background:rgba(255,255,255,.15);border-radius:6px;padding:8px;margin-top:8px;font-size:11px}
.res-card{background:#fff;border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.res-card .name{font-size:13px;font-weight:700}.res-card .count{font-size:11px;color:#888}
.res-card .media{font-size:22px;font-weight:800}.res-card .nivel{font-size:10px;font-weight:600}
.res-global{background:var(--ink);border-radius:10px;padding:16px;margin-top:4px;color:#fff}
.res-global .label{font-size:12px;opacity:.7}.res-global .media{font-size:34px;font-weight:800}
.incump{border-radius:8px;padding:8px 12px;margin-bottom:6px}
.incump .head{display:flex;justify-content:space-between}.incump .p-name{font-size:12px;font-weight:700;color:#333}
.incump .p-score{font-size:14px;font-weight:800}
.legal-box{background:#FFF7E6;border:1px solid #E8D5A0;border-radius:8px;padding:12px;margin-top:16px;font-size:11px;line-height:1.5;color:#5A4A00}
.credits{background:#fff;border-radius:10px;border:1px solid #eee;padding:14px;margin-top:16px}
.credits h3{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:10px}
.credit-person{margin-bottom:6px;padding-left:8px;border-left:2px solid var(--ink)}
.credit-person .name{font-size:11px;font-weight:600;color:var(--ink)}
.credit-person .aff{font-size:10px;color:#888}
.credit-dev{border-top:1px solid #eee;margin-top:10px;padding-top:10px}
.credit-dev .devtitle{font-size:11px;font-weight:600;color:var(--ink)}
.credit-dev .devline{font-size:10px;color:#888;margin-top:4px}
.credit-dev a{color:var(--blue);text-decoration:none}
.footer-line{text-align:center;padding:12px 0 4px;font-size:9px;color:#ccc}
.btn-pdf{width:100%;padding:12px;background:var(--ink);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-pdf:active{opacity:.9}
#print-overlay{display:none}
@media print{
body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#root{display:none!important}
#print-overlay{display:block!important;font-family:Arial,sans-serif;font-size:10px;color:#1a1a1a}
#print-overlay *{box-sizing:border-box}
.p-page{page-break-after:always;padding:10mm 8mm}
.p-page:last-child{page-break-after:auto}
.p-hdr{background:#2F4F3E!important;color:#fff!important;padding:8px 14px;font-size:13px;font-weight:700;margin-bottom:8px}
.p-hdr small{font-size:9px;opacity:.8;display:block}
.p-meta{border-collapse:collapse;width:100%;margin-bottom:8px;font-size:9px}
.p-meta td{border:1px solid #ccc;padding:3px 7px}
.p-meta .lbl{background:#E7F0EA!important;font-weight:700;width:22%;color:#2F4F3E;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.p-area-hdr{padding:5px 12px;color:#fff!important;font-size:11px;font-weight:700;margin:8px 0 4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.p-tbl{width:100%;border-collapse:collapse;font-size:8px;margin-bottom:4px}
.p-tbl th{background:#2F4F3E!important;color:#fff!important;padding:3px 5px;text-align:left;font-weight:600;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.p-tbl td{border:1px solid #ddd;padding:2px 5px;vertical-align:top}
.p-tbl .sc0{background:#E6F9EE!important}.p-tbl .sc1{background:#FFFBEA!important}.p-tbl .sc2{background:#FEF0E6!important}.p-tbl .sc3{background:#FFE4E4!important}
.p-tbl .cr{background:#FFF0F0!important}
.p-res{border:2px solid #2F4F3E;border-collapse:collapse;width:60%;margin:8px auto;font-size:10px}
.p-res th{background:#2F4F3E!important;color:#fff!important;padding:4px 8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.p-res td{border:1px solid #2F4F3E;padding:4px 8px;text-align:center}
.p-res .total{background:#E7F0EA!important;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.p-inc .item{padding:3px 8px;margin-bottom:2px;border-left:3px solid;font-size:8.5px}
.p-legal{background:#FFF7E6!important;border:1px solid #E8D5A0;padding:6px 8px;font-size:7.5px;margin:8px 0;color:#5A4A00;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.p-firmas{display:flex;gap:20px;margin-top:14px}
.p-firma{flex:1;border-top:1px solid #999;padding-top:4px;font-size:7.5px;color:#666;text-align:center}
.p-credits{font-size:7px;color:#aaa;text-align:center;margin-top:10px;line-height:1.5}
@page{size:A4 landscape;margin:6mm}
}
/* Welcome */
.welcome{max-width:520px;margin:0 auto;padding:20px}
.welcome .logo{text-align:center;margin-bottom:20px}
.welcome .logo img{display:block;margin:0 auto}
.welcome h1{font-size:20px;color:var(--ink);font-weight:700}
.welcome .sub{font-size:12px;color:#888;margin-top:4px}
.legal-panel{background:#FFF7E6;border:1px solid #E8D5A0;border-radius:10px;padding:16px;margin-bottom:16px}
.legal-panel h3{font-size:14px;color:var(--amber);margin:0 0 8px}
.legal-panel p{font-size:12px;line-height:1.6;color:#5A4A00;margin:8px 0 0}
.scale-panel{background:var(--ink-l);border-radius:10px;padding:16px;margin-bottom:16px}
.scale-panel h3{font-size:14px;color:var(--ink);margin:0 0 8px}
.scale-item{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.scale-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.accept-btn{width:100%;padding:14px;background:var(--ink);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.accept-btn:active{opacity:.9}
@media(max-width:400px){.score-btn{font-size:13px;padding:6px 0}}
</style>
</head>
<body>
<div id="root"></div>
<script>
// ═══════════════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════════════
const AREAS=[
{id:"A1",name:"Alimentación",sub:"Libre de hambre y sed",icon:"🌾",color:"#2F4F3E",light:"#E7F0EA"},
{id:"A2",name:"Alojamiento",sub:"Libre de incomodidad",icon:"🏠",color:"#1A5276",light:"#EBF5FB"},
{id:"A3",name:"Salud",sub:"Libre de dolor y enfermedades",icon:"🩺",color:"#7B241C",light:"#FDEDEC"},
{id:"A4",name:"Comportamiento",sub:"Libre de miedo y angustia",icon:"🐴",color:"#6C3483",light:"#F5EEF8"}
];
const SM=[
{v:0,l:"Muy bien",c:"#1A7F37",b:"#E6F9EE"},
{v:1,l:"Leve",c:"#856A00",b:"#FFFBEA"},
{v:2,l:"Deficiente",c:"#E67E22",b:"#FEF0E6"},
{v:3,l:"Muy mal",c:"#C0392B",b:"#FFE4E4"}
];
const NIV=[
{mx:.5,l:"ÓPTIMO",c:"#1A7F37",b:"#E6F9EE",a:"Sin actuación"},
{mx:1,l:"ACEPTABLE",c:"#856A00",b:"#FFFBEA",a:"Recomendaciones"},
{mx:2,l:"DEFICIENTE",c:"#E67E22",b:"#FEF0E6",a:"Requerimiento ≤ 1 semana"},
{mx:3,l:"GRAVE",c:"#C0392B",b:"#FFE4E4",a:"Actuación < 48 h"}
];
const gN=m=>{if(m==null||isNaN(m))return null;return NIV.find(n=>m<=n.mx)||NIV[3]};
const MC={"Al llegar":"#C0392B","Recorrido":"#E67E22","Preguntar":"#1A5276"};
const MB={"Al llegar":"#FFE4E4","Recorrido":"#FEF0E6","Preguntar":"#EBF5FB"};

const P=[
{id:1,a:"A1",t:"Condición corporal (BCS Henneke)",s:"Completar Anexo I (BCS ideal: 4-6). Explorar 6 zonas.",cr:1,m:"Al llegar",v:"Observación",lg:"RD 804/2011, art. 4.5.f",c:["BCS 5. Costillas palpables no visibles.","BCS 4 ó 6. Ligera desviación del ideal.","BCS 3 ó 7. Costillas visibles o grasa marcada.","BCS ≤2 ó ≥8. Emaciación u obesidad con riesgo."]},
{id:2,a:"A1",t:"Agua fresca disponible",s:"Comprobar antes de avisar al titular.",cr:1,m:"Al llegar",v:"Observación",lg:"RD 804/2011, art. 4.1.c",c:["Agua limpia y accesible a todos.","Disponible pero punto único para grupo numeroso.","Bebedero vacío; se rellena solo a demanda.","Sin agua ni sistema de suministro."]},
{id:3,a:"A1",t:"Calidad del agua",s:"Clasificar: limpia / turbia / con heces.",cr:0,m:"Recorrido",v:"Observación",lg:"RD 804/2011, art. 4.1.c",c:["Agua transparente, recipiente limpio.","Ligeramente turbia o con restos.","Sucia, con algas o biofilm.","Contaminada con heces. No potable."]},
{id:4,a:"A1",t:"Tipo y calidad del alimento",s:"Sin moho, sin polvo excesivo, sin fermentaciones.",cr:0,m:"Recorrido",v:"Observación",lg:"RD 804/2011, art. 4.1",c:["Adecuado, buen estado de conservación.","Adecuado, ligera pérdida de calidad.","Polvoriento, moho puntual o poco adecuado.","Enmohecido, fermentado o en descomposición."]},
{id:5,a:"A1",t:"Cantidad de alimento adecuada",s:"Ref.: 1,5-2 % PV en MS/día. Estimar con cinta o preguntar.",cr:0,m:"Preguntar",v:"Obs. + entrevista",lg:"RD 804/2011, art. 4.1.b",c:["1,5–2 % PV en MS/día, ajustado.","Ligeramente por debajo o encima.","Claramente insuficiente o excesiva.","Privación de alimento evidente."]},
{id:6,a:"A1",t:"Frecuencia de alimentación (≥ 2/día)",s:"En extensivo con pasto libre puede ser 0.",cr:0,m:"Preguntar",v:"Obs. + entrevista",lg:"RD 804/2011, art. 4.1",c:["Ad libitum o ≥ 2 tomas regulares.","2 tomas justas con intervalos largos.","Una sola toma diaria.","Alimentación irregular o > 24 h sin toma."]},
{id:7,a:"A1",t:"Estado del comedero",s:"Limpio, sin moho ni restos en descomposición.",cr:0,m:"Recorrido",v:"Observación",lg:"RD 804/2011, art. 4.1",c:["Limpio y en buen estado.","Con restos de la toma anterior.","Sucio, con moho o suciedad.","Alimento en descomposición. Insalubre."]},
{id:8,a:"A1",t:"Acceso al forraje base",s:"0=continuo · 1=<8h · 2=8-12h · 3=>12h sin forraje.",cr:0,m:"Recorrido",v:"Obs. + registros",lg:"Dir. 98/58/CE, art. 10",c:["Acceso continuo a forraje o pastoreo.","Intervalos < 8 h sin forraje.","Intervalos de 8–12 h.","Intervalos > 12 h. Riesgo úlcera gástrica."]},
{id:9,a:"A1",t:"Ración ajustada al estado fisiológico",s:"¿Aplica lactación/gestación/crecimiento/trabajo? Si N/A, no puntúa.",cr:0,m:"Preguntar",v:"Obs. + entrevista + reg.",lg:"RD 804/2011, art. 4.1.b",c:["Ración específica ajustada.","Ajuste parcial o mal documentado.","Sin ajuste pese a necesidad evidente.","Sin ajuste y con deterioro corporal."]},
{id:10,a:"A2",t:"Refugio frente a lluvia y sol",s:"Accesible simultáneamente a todos los animales.",cr:0,m:"Recorrido",v:"Observación",lg:"RD 804/2011, art. 4.2",c:["Refugio accesible a todos.","Pequeño para el tamaño del grupo.","Deteriorado o protección parcial.","Sin refugio disponible."]},
{id:11,a:"A2",t:"Refugio adecuado al clima",s:"Valorar viento, humedad, heladas según zona.",cr:0,m:"Recorrido",v:"Observación",lg:"RD 804/2011, art. 4.2",c:["Protege eficazmente de viento, lluvia y sol.","Protección parcial frente a algún factor.","Insuficiente para el clima local.","Inexistente con condiciones adversas."]},
{id:12,a:"A2",t:"Superficie de descanso",s:"Cama seca, sin bordes cortantes, suelo antideslizante.",cr:0,m:"Recorrido",v:"Observación",lg:"RD 804/2011, art. 4.2",c:["Cama seca, limpia, espesor suficiente.","Cama algo húmeda o escasa.","Cama sucia o mojada; suelo duro sin cama.","Sin cama, encharcado o con bordes cortantes."]},
{id:13,a:"A2",t:"Espacio por animal (≥ 9 m² box / ≥ 6 m²/animal)",s:"Medir box individual o calcular m²÷nº animales.",cr:0,m:"Recorrido",v:"Observación (medición)",lg:"RD 804/2011, art. 4.2",c:["Cumple o supera la referencia.","Ligeramente por debajo.","Claramente insuficiente.","Hacinamiento. No puede tumbarse."]},
{id:14,a:"A2",t:"Ventilación e iluminación",s:"Renovación de aire, sin olor a amoníaco. Luz natural.",cr:0,m:"Recorrido",v:"Observación",lg:"RD 804/2011, art. 4.2",c:["Buena ventilación, sin olores. Luz natural.","Ligero olor a amoníaco o iluminación justa.","Olor fuerte, polvo o escasa luz.","Aire irrespirable u oscuridad permanente."]},
{id:15,a:"A2",t:"Temperatura ambiental",s:"Zona de confort aprox. −5 a +25 ºC.",cr:0,m:"Recorrido",v:"Observación",lg:"Dir. 98/58/CE, art. 7",c:["Dentro de zona de confort.","En el límite, con aclimatación.","Fuera de confort con protección parcial.","Temperatura extrema sin protección."]},
{id:16,a:"A2",t:"Libertad de movimientos",s:"Puede tumbarse, levantarse, girar. Comprobar ataduras.",cr:1,m:"Recorrido",v:"Observación",lg:"RD 804/2011, art. 4.2",c:["Libertad plena de movimiento.","Restricción moderada y justificada.","Atado o box reducido la mayor parte del día.","Atado permanente. No puede tumbarse."]},
{id:17,a:"A2",t:"Densidad de animales",s:"Derivar del parámetro 13. Competencia por recursos.",cr:0,m:"Recorrido",v:"Observación",lg:"RD 804/2011, art. 4.2",c:["Todos acceden a recursos sin competencia.","Densidad algo elevada, sin conflictos.","Alta densidad con competencia.","Hacinamiento con agresiones o lesiones."]},
{id:18,a:"A2",t:"Vallado (bordes, alambres)",s:"Espino en contacto directo = deficiente/grave.",cr:0,m:"Recorrido",v:"Observación",lg:"RD 804/2011, art. 4.2",c:["Vallado íntegro y seguro.","Desperfectos menores sin riesgo.","Elementos cortantes accesibles.","Espino en contacto directo. Riesgo alto."]},
{id:19,a:"A2",t:"Limpieza general del alojamiento",s:"Excelente / Buena / Regular / Mala.",cr:0,m:"Recorrido",v:"Observación",lg:"RD 804/2011, art. 4.2",c:["Limpio, sin acumulaciones.","Acumulación puntual de heces.","Heces acumuladas. Ambiente sucio.","Insalubre, materiales peligrosos."]},
{id:20,a:"A2",t:"Estercolero",s:"Impermeabilización y capacidad.",cr:0,m:"Preguntar",v:"Obs. + documentación",lg:"RD 804/2011, art. 4.3.g",c:["Impermeabilizado, capacidad adecuada.","Capacidad justa.","Sin impermeabilizar o desbordado.","Filtración a aguas. Foco insalubre."]},
{id:21,a:"A2",t:"Acceso a ejercicio o pastoreo",s:"Verificar por observación y entrevista. Anotar horas.",cr:0,m:"Preguntar",v:"Obs. + entrevista",lg:"Dir. 98/58/CE, art. 4",c:["Acceso diario a pastoreo o ejercicio.","Acceso frecuente, no diario.","Acceso esporádico.","Sin acceso. Confinamiento permanente."]},
{id:22,a:"A3",t:"Estado locomotor — cribado cojera",s:"Línea recta 20 m y en círculo. Si detecta, gradúe en P23.",cr:1,m:"Al llegar",v:"Observación",lg:"RD 804/2011, art. 4.4",c:["Movimiento simétrico y fluido.","Irregularidad leve, difícil de localizar.","Cojera visible al trote.","Cojera al paso o no apoya la extremidad."]},
{id:23,a:"A3",t:"Grado de cojera (AAEP 0-5)",s:"Complementa P22. Si P22=0, este=0.",cr:1,m:"Recorrido",v:"Observación",lg:"RD 804/2011, art. 4.4",c:["Grado 0. Sin cojera.","Grado 1. Intermitente.","Grado 2–3. Constante al trote.","Grado 4–5. Al paso o sin apoyo."]},

function renderMeta(){
const f=(label,key,type)=>{const v=e(state.meta[key]||"");if(type==="select")return`<div class="field"><label>${label}</label><select data-meta="${key}"><option${v==="Rutina"?" selected":""}>Rutina</option><option${v==="Denuncia"?" selected":""}>Denuncia</option><option${v==="Seguimiento"?" selected":""}>Seguimiento</option></select></div>`;return`<div class="field"><label>${label}</label><input type="${type||"text"}" value="${v}" data-meta="${key}"></div>`};
return`<h2 style="font-size:16px;color:#2F4F3E;margin-bottom:12px">Datos de la inspección</h2><div class="section-hdr">Animal</div>${f("Nombre / código","nombre")}${f("Especie / Raza","especie")}${f("Edad / Sexo","edad")}${f("Nº identificación (UELN)","uid")}<div class="section-hdr">Explotación</div>${f("Código REGA","rega")}${f("Nombre de la explotación","explotacion")}${f("Titular del équido","titEquido")}${f("Titular de la explotación","titExpl")}${f("Dirección","direccion")}${f("Ayuntamiento","ayuntamiento")}${f("Provincia","provincia")}<div class="section-hdr">Persona de contacto</div>${f("Nombre de contacto","contacto")}${f("Teléfono","telefono","tel")}${f("Email","email","email")}<div class="section-hdr">Visita</div>${f("Fecha","fecha","date")}${f("Motivo","motivo","select")}${f("Personal técnico","tecnico")}${f("Nº colegiación / cargo","colegiado")}${navBtns("meta")}`}

function renderArea(ar){
const st=areaStats(ar.id);const pct=st.total?(st.done/st.total*100):0;
let h=`<div class="area-banner" style="background:${ar.color}"><h2>${ar.icon} ${ar.name}</h2><small>${ar.sub}</small><div class="progress"><div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:#fff"></div></div><span style="color:#fff;font-weight:600">${st.done}/${st.total}</span></div></div>`;
P.filter(p=>p.a===ar.id).forEach(p=>{h+=renderCard(p,ar.color)});
if(st.done>0){const nv=gN(st.media);h+=`<div class="area-result" style="background:${ar.color}"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:11px;opacity:.7">Media del área (${st.num} parámetros)</div><div class="media">${st.media!=null?st.media.toFixed(2):"—"}</div></div>${nv?`<div style="text-align:right"><div class="nivel-badge" style="background:${nv.b};color:${nv.c}">${nv.l}</div><div class="act">${nv.a}</div></div>`:""}</div>${st.hasCrit3?`<div class="crit-alert">⚠ Parámetro crítico con puntuación 3 → actuación urgente independiente de la media.</div>`:""}</div>`}
const photos=state.photos[ar.id]||[];
h+=`<div style="background:#fff;border-radius:10px;border:1px solid #eee;padding:12px;margin-top:10px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:13px;font-weight:700;color:${ar.color}">📷 Fotografías — ${ar.name}</span><label style="background:${ar.color};color:#fff;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px"><input type="file" accept="image/*" capture="environment" multiple data-photo="${ar.id}" style="display:none">📸 Foto</label></div>`;
if(photos.length){h+=`<div style="display:flex;flex-wrap:wrap;gap:6px">`;photos.forEach((ph,i)=>{h+=`<div style="position:relative;width:72px;height:72px;border-radius:6px;overflow:hidden;border:1px solid #ddd"><img src="${ph.data}" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);color:#fff;font-size:7px;padding:1px 3px;text-align:center">${ph.name||"foto"}</div><button data-delphoto="${ar.id}-${i}" style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:10px;cursor:pointer;line-height:18px">✕</button></div>`});h+=`</div><div style="font-size:10px;color:#888;margin-top:4px">${photos.length} foto${photos.length>1?"s":""} adjunta${photos.length>1?"s":""}</div>`}else{h+=`<div style="font-size:11px;color:#aaa;text-align:center;padding:10px 0">Sin fotografías. Use el botón para hacer o subir fotos.</div>`}
h+=`</div>`;
h+=navBtns(ar.id);
return h}

function renderCard(p,aColor){
const sc=state.scores[p.id],scored=sc!=null,sm=scored?SM[sc]:null,open=!!state.openCards[p.id];
let h=`<div class="card${p.cr&&sc===3?" crit3":""}"><div class="card-head" data-toggle="${p.id}"><span class="num${p.cr?" crit":""}" style="${!p.cr?`background:#f5f5f5;color:${aColor}`:""}">${p.cr?"⚠ ":""}${p.id}</span><div style="flex:1;min-width:0"><div class="title">${e(p.t)}</div><div class="sub">${e(p.s)}</div></div>${scored?`<span class="badge" style="background:${sm.b};color:${sm.c}">${sc}</span>`:""}<span class="arrow${open?" open":""}">▼</span></div>`;
if(open){h+=`<div class="card-body"><div class="mom-tags"><span class="mom-tag" style="color:${MC[p.m]||"#888"};background:${MB[p.m]||"#f5f5f5"}">${p.m}</span><span class="mom-tag" style="color:#666;background:#f5f5f5">${p.v}</span></div><div class="crit-grid">${p.c.map((c,i)=>`<div class="crit-cell" style="background:${SM[i].b};color:${SM[i].c};border-left:3px solid ${SM[i].c}"><strong>${i}</strong> ${e(c)}</div>`).join("")}</div><div class="score-btns">${[0,1,2,3].map(v=>`<button class="score-btn${sc===v?" sel":""}" style="background:${sc===v?SM[v].c:SM[v].b};color:${sc===v?"#fff":SM[v].c};${sc===v?`border-color:${SM[v].c}`:""}" data-score="${p.id}-${v}">${v}</button>`).join("")}${scored?`<button class="clear-btn" data-clear="${p.id}">✕</button>`:""}</div><textarea class="obs-field" data-obs="${p.id}" placeholder="Observaciones / incidencias…">${e(state.obs[p.id]||"")}</textarea><div class="legal-ref">${e(p.lg)}</div></div>`}
h+=`</div>`;return h}

function renderResult(){
let h=`<h2 style="font-size:16px;color:#2F4F3E;margin-bottom:12px">Resumen de la evaluación</h2>`;
const medias=[];
AREAS.forEach(ar=>{const st=areaStats(ar.id);const nv=gN(st.media);if(st.media!=null)medias.push(st.media);
h+=`<div class="res-card"><div><div class="name" style="color:${ar.color}">${ar.icon} ${ar.name}</div><div class="count">${st.done}/${st.total} evaluados</div></div><div style="text-align:right"><div class="media" style="color:${nv?nv.c:"#ccc"}">${st.media!=null?st.media.toFixed(2):"—"}</div>${nv?`<div class="nivel" style="color:${nv.c}">${nv.l}</div>`:""}</div></div>${st.hasCrit3?`<div style="background:#FFE4E4;border-radius:6px;padding:6px;margin:-4px 0 8px;font-size:11px;color:#C0392B;font-weight:600">⚠ Crítico con 3 → Actuación urgente</div>`:""}`});
const gm=medias.length===4?medias.reduce((a,b)=>a+b,0)/4:null;const gnv=gN(gm);
h+=`<div class="res-global"><div class="label">Puntuación global (media de las 4 áreas)</div><div style="display:flex;justify-content:space-between;align-items:center"><div class="media">${gm!=null?gm.toFixed(2):"—"}</div>${gnv?`<div style="text-align:right"><div class="nivel-badge" style="background:${gnv.b};color:${gnv.c}">${gnv.l}</div><div class="act">${gnv.a}</div></div>`:""}</div></div>`;
// Incumplimientos
const bad=P.filter(p=>state.scores[p.id]>=2).sort((a,b)=>state.scores[b.id]-state.scores[a.id]);
if(bad.length){h+=`<h3 style="font-size:14px;color:#C0392B;margin:16px 0 8px">Incumplimientos detectados (${bad.length})</h3>`;bad.forEach(p=>{const sc=state.scores[p.id];h+=`<div class="incump" style="background:${sc===3?"#FFE4E4":"#FEF0E6"};border-left:4px solid ${sc===3?"#C0392B":"#E67E22"}"><div class="head"><span class="p-name">${p.cr?"⚠ ":""}P${p.id} — ${e(p.t)}</span><span class="p-score" style="color:${sc===3?"#C0392B":"#E67E22"}">${sc}</span></div>${state.obs[p.id]?`<div style="font-size:11px;color:#666;margin-top:2px">${e(state.obs[p.id])}</div>`:""}<div style="font-size:9px;color:#999;margin-top:2px">${e(p.lg)}</div></div>`})}
// Proxima visita
h+=`<div style="background:#fff;border-radius:10px;border:1px solid #eee;padding:12px;margin-top:16px"><div style="font-size:13px;font-weight:700;color:#2F4F3E;margin-bottom:8px">📅 Próxima visita</div><div class="field"><label>Fecha de próxima visita prevista</label><input type="date" value="${e(state.proximaVisita||"")}" data-proxvisita style="width:100%;padding:8px;border-radius:6px;border:1px solid #ddd;font-size:13px"></div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${["Inmediata","48 horas","1 semana","1 mes","3 meses","6 meses"].map(op=>`<button data-proxlabel="${op}" style="padding:5px 12px;border-radius:6px;font-size:11px;cursor:pointer;border:1px solid ${state.proximaVisitaLabel===op?"#2F4F3E":"#ddd"};background:${state.proximaVisitaLabel===op?"#E7F0EA":"#fff"};color:${state.proximaVisitaLabel===op?"#2F4F3E":"#666"};font-weight:${state.proximaVisitaLabel===op?"700":"400"}">${op}</button>`).join("")}</div></div>`;
// Legal
h+=`<div class="legal-box"><strong>Aviso legal:</strong> Los resultados de esta evaluación son orientativos. La responsabilidad de la evaluación recae íntegramente en el profesional que firma la ficha de inspección. Esta herramienta no sustituye el criterio profesional del técnico evaluador.</div>`;
// Credits
h+=`<div class="credits"><h3>Autores</h3>${[["Jesús Cantalapiedra Álvarez","Servicio de Ganadería de Lugo. Consellería do Medio Rural. Xunta de Galicia."],["José Ángel Hernández Malagón","Dpto. de Patología Animal. Univ. de Santiago de Compostela."],["María Elena Fernández Rodríguez","Dpto. de Ingeniería Agroforestal. Univ. de Santiago de Compostela."],["Mercedes Camiña García","Dpto. de Fisiología. Univ. de Santiago de Compostela."],["Isabel Blanco Penedo","Dpto. de Ciencia Animal. Universidad de Lleida."]].map(([n,a])=>`<div class="credit-person"><div class="name">${n}</div><div class="aff">${a}</div></div>`).join("")}<div class="credit-dev"><div class="devtitle">Desarrollo y colaboración técnica</div><div class="devline">Cristina Vierna — Técnico de I+D+i. CTC <a href="https://www.ceteca.net" target="_blank">(www.ceteca.net)</a></div><div class="devline">EUnethorse España <a href="https://www.eunethorse.eu" target="_blank">(www.eunethorse.eu)</a></div></div></div>`;
h+=`<button class="btn-pdf" data-action="pdf">📄 Descargar informe PDF</button>`;
h+=navBtns("result");
h+=`<div class="footer-line">Evaluación de Bienestar Animal Equino · 47 parámetros · Escala 0-3</div>`;
return h}

function generatePDF(){
const m=state.meta,sc=state.scores,ob=state.obs;
const scClass=v=>v===0?"sc0":v===1?"sc1":v===2?"sc2":v===3?"sc3":"";
const metaRow=(l,v)=>`<tr><td class="lbl">${l}</td><td>${e(v||"—")}</td></tr>`;
const fecha=m.fecha||new Date().toISOString().slice(0,10);

// Header + meta table
let hdr=`<div class="p-hdr">FICHA DE EVALUACIÓN DE BIENESTAR ANIMAL EQUINO<small>Protección animal en explotaciones de équidos · ${fecha}</small></div>`;
let meta=`<table class="p-meta">${metaRow("Animal",m.nombre)}${metaRow("Especie / Raza",m.especie)}${metaRow("Edad / Sexo",m.edad)}${metaRow("Identificación",m.uid)}${metaRow("REGA",m.rega)}${metaRow("Explotación",m.explotacion)}${metaRow("Titular équido",m.titEquido)}${metaRow("Titular explotación",m.titExpl)}${metaRow("Dirección",m.direccion)}${metaRow("Ayuntamiento / Provincia",(m.ayuntamiento||"")+" / "+(m.provincia||""))}${metaRow("Persona de contacto",m.contacto)}${metaRow("Teléfono / Email",(m.telefono||"")+" / "+(m.email||""))}${metaRow("Motivo",m.motivo)}${metaRow("Técnico",m.tecnico)}${metaRow("Nº colegiación",m.colegiado)}</table>`;

// Page 1: datos + tabla resumen + incumplimientos
let p1=`<div class="p-page">${hdr}${meta}`;
// Summary table
const medias=[];
p1+=`<table class="p-res"><tr><th>Área</th><th>Nº param.</th><th>Evaluados</th><th>Suma</th><th>Media</th><th>Nivel</th><th>Actuación</th></tr>`;
AREAS.forEach(ar=>{const st=areaStats(ar.id);const nv=gN(st.media);if(st.media!=null)medias.push(st.media);
p1+=`<tr><td style="text-align:left;font-weight:600">${ar.icon} ${ar.name}</td><td>${st.total}</td><td>${st.done}</td><td>${st.sum}</td><td style="font-weight:700">${st.media!=null?st.media.toFixed(2):"—"}</td><td>${nv?nv.l:"—"}</td><td style="font-size:8px">${nv?nv.a:"—"}</td></tr>`});
const gm=medias.length===4?medias.reduce((a,b)=>a+b,0)/4:null;const gnv=gN(gm);
p1+=`<tr class="total"><td style="text-align:left;font-weight:700">PUNTUACIÓN GLOBAL</td><td>47</td><td>${Object.keys(sc).length}</td><td>${Object.values(sc).reduce((s,v)=>s+(typeof v==="number"?v:0),0)}</td><td style="font-size:13px;font-weight:800">${gm!=null?gm.toFixed(2):"—"}</td><td style="font-weight:700">${gnv?gnv.l:"—"}</td><td>${gnv?gnv.a:"—"}</td></tr></table>`;

// Incumplimientos
const bad=P.filter(p=>sc[p.id]>=2).sort((a,b)=>sc[b.id]-sc[a.id]);
if(bad.length){p1+=`<div style="font-size:11px;font-weight:700;color:#C0392B;margin:8px 0 4px">Incumplimientos detectados (${bad.length})</div><div class="p-inc">`;
bad.forEach(p=>{const sv=sc[p.id];p1+=`<div class="item" style="border-color:${sv===3?"#C0392B":"#E67E22"};background:${sv===3?"#FFE4E4":"#FEF0E6"}">${p.cr?"⚠ ":""}P${p.id} — ${e(p.t)} → <strong>${sv}</strong>${ob[p.id]?" — "+e(ob[p.id]):""} <span style="color:#999;font-size:7px">(${e(p.lg)})</span></div>`});
p1+=`</div>`}

// Legal + firmas
p1+=`<div class="p-legal"><strong>Aviso legal:</strong> Esta herramienta es un instrumento de apoyo. La responsabilidad de la evaluación recae íntegramente en el profesional que firma la ficha de inspección. No sustituye el criterio profesional del técnico evaluador.</div>`;
p1+=`<div class="p-firmas"><div class="p-firma">Firma del técnico evaluador<br><br><br>Nombre, cargo y nº colegiado</div><div class="p-firma">Firma del titular de la explotación<br><br><br>Nombre, NIF y fecha</div><div class="p-firma">Próxima revisión prevista<br><br>${state.proximaVisitaLabel?`<strong>${state.proximaVisitaLabel}</strong>`:""} ${state.proximaVisita?`<br>Fecha: ${state.proximaVisita}`:""}<br>☐ Inmediata ☐ 48 h<br>☐ 1 semana ☐ 1 mes</div></div>`;
p1+=`<div class="p-credits">Autores: J. Cantalapiedra · J.Á. Hernández Malagón · M.E. Fernández Rodríguez · M. Camiña García · I. Blanco Penedo<br>Desarrollo: Cristina Vierna — CTC (www.ceteca.net) · EUnethorse España (www.eunethorse.eu)</div>`;
p1+=`</div>`;

// Page 2+: detail tables per area
let pages="";
AREAS.forEach(ar=>{
const ap=P.filter(p=>p.a===ar.id);const st=areaStats(ar.id);const nv=gN(st.media);
let pg=`<div class="p-page">${hdr}<div class="p-area-hdr" style="background:${ar.color}!important">${ar.icon} ${ar.name} — ${ar.sub}</div>`;
pg+=`<table class="p-tbl"><tr><th style="width:4%">Nº</th><th style="width:3%">⚠</th><th style="width:28%">Parámetro</th><th style="width:8%">Momento</th><th style="width:8%">Verif.</th><th style="width:5%">Punt.</th><th style="width:44%">Observaciones / Incidencias</th></tr>`;
ap.forEach(p=>{const sv=sc[p.id];const scored=sv!=null;
pg+=`<tr class="${p.cr?"cr":""}"><td style="text-align:center;font-weight:700;color:${p.cr?"#C0392B":ar.color}">${p.id}</td><td style="text-align:center;color:#C0392B">${p.cr?"⚠":""}</td><td><strong>${e(p.t)}</strong><br><span style="font-size:7px;color:#888">${e(p.s)}</span></td><td style="font-size:7px">${p.m}</td><td style="font-size:7px">${p.v}</td><td class="${scored?scClass(sv):""}" style="text-align:center;font-weight:700;font-size:12px">${scored?sv:"—"}</td><td style="font-size:8px">${e(ob[p.id]||"")}</td></tr>`});
pg+=`</table>`;
pg+=`<table style="width:50%;border-collapse:collapse;font-size:9px;margin-top:4px"><tr><td style="border:1px solid #2F4F3E;padding:4px 8px;background:${ar.color}!important;color:#fff;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact">Media del área</td><td style="border:1px solid #2F4F3E;padding:4px 8px;text-align:center;font-weight:800;font-size:14px">${st.media!=null?st.media.toFixed(2):"—"}</td><td style="border:1px solid #2F4F3E;padding:4px 8px;text-align:center;font-weight:600">${nv?nv.l:"—"}</td><td style="border:1px solid #2F4F3E;padding:4px 8px;text-align:center;font-size:8px">${nv?nv.a:"—"}</td></tr></table>`;
if(st.hasCrit3)pg+=`<div style="font-size:8px;color:#C0392B;margin-top:3px">⚠ Parámetro crítico con puntuación 3 → actuación urgente independiente de la media.</div>`;
pg+=`<div class="p-credits" style="margin-top:8px">Autores: J. Cantalapiedra · J.Á. Hernández Malagón · M.E. Fernández Rodríguez · M. Camiña García · I. Blanco Penedo · Desarrollo: Cristina Vierna CTC · EUnethorse España</div>`;
pg+=`</div>`;
pages+=pg});

// Insert into DOM
let overlay=document.getElementById("print-overlay");
if(!overlay){overlay=document.createElement("div");overlay.id="print-overlay";document.body.appendChild(overlay)}
overlay.innerHTML=p1+pages;
setTimeout(()=>window.print(),200);
}

// ═══════════════════════════════════════════════════════════════
// EVENT BINDING
// ═══════════════════════════════════════════════════════════════
function bindEvents(){
document.querySelectorAll("[data-action=accept]").forEach(el=>el.onclick=()=>{state.accepted=true;render()});
document.querySelectorAll("[data-action=reset]").forEach(el=>el.onclick=()=>{if(confirm("¿Borrar todos los datos de esta inspección?")){state.meta={nombre:"",especie:"",edad:"",uid:"",rega:"",explotacion:"",titEquido:"",titExpl:"",direccion:"",ayuntamiento:"",provincia:"",contacto:"",telefono:"",email:"",fecha:new Date().toISOString().slice(0,10),motivo:"Rutina",tecnico:"",colegiado:""};state.scores={};state.obs={};state.openCards={};state.photos={};state.proximaVisita="";state.proximaVisitaLabel="";render()}});
document.querySelectorAll("[data-tab]").forEach(el=>el.onclick=()=>{state.tab=el.dataset.tab;render();document.querySelector(".content")?.scrollTo(0,0);window.scrollTo(0,0)});
document.querySelectorAll("[data-meta]").forEach(el=>{const k=el.dataset.meta;el.addEventListener("input",()=>{state.meta[k]=el.value;save()})});
document.querySelectorAll("[data-toggle]").forEach(el=>el.onclick=()=>{const id=el.dataset.toggle;state.openCards[id]=!state.openCards[id];render()});
document.querySelectorAll("[data-score]").forEach(el=>el.onclick=()=>{const[id,v]=el.dataset.score.split("-");state.scores[parseInt(id)]=parseInt(v);render()});
document.querySelectorAll("[data-clear]").forEach(el=>el.onclick=()=>{delete state.scores[parseInt(el.dataset.clear)];render()});
document.querySelectorAll("[data-obs]").forEach(el=>{const id=parseInt(el.dataset.obs);el.addEventListener("input",()=>{state.obs[id]=el.value;save()})});
document.querySelectorAll("[data-action=pdf]").forEach(el=>el.onclick=()=>generatePDF());
document.querySelectorAll("[data-photo]").forEach(el=>{el.onchange=function(){const aid=this.dataset.photo;if(!state.photos[aid])state.photos[aid]=[];Array.from(this.files).forEach(file=>{const reader=new FileReader();reader.onload=ev=>{state.photos[aid].push({data:ev.target.result,name:file.name.slice(0,20)});render()};reader.readAsDataURL(file)})}});
document.querySelectorAll("[data-delphoto]").forEach(el=>el.onclick=()=>{const[aid,idx]=el.dataset.delphoto.split("-");if(state.photos[aid]){state.photos[aid].splice(parseInt(idx),1);render()}});
document.querySelectorAll("[data-proxvisita]").forEach(el=>el.onchange=function(){state.proximaVisita=this.value;save()});
document.querySelectorAll("[data-proxlabel]").forEach(el=>el.onclick=()=>{state.proximaVisitaLabel=el.dataset.proxlabel;render()});
}

render();
</script>
</body>
</html>
